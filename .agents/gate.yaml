policy: false

rules:
  # Same Prettier check as frontend CI, scoped to changed files.
  - match:
      - "frontend/**/*.{ts,tsx,js,mjs,cjs,json,scss,yaml,md}"
    run:
      - name: frontend-format
        cmd: |
          set -eu
          eval "set -- $CLAUDE_GATE_FILES"
          for file do
            [ -f "$file" ] || continue
            mise run exec -- pnpm --dir frontend exec prettier --check -- "$CLAUDE_PROJECT_DIR/$file"
          done
    run_checks:
      - frontend-build

  # Same ESLint rules as frontend CI, scoped to changed source/config files.
  - match:
      - "frontend/**/*.{ts,tsx,js,mjs,cjs}"
    run:
      - name: frontend-lint
        cmd: |
          set -eu
          eval "set -- $CLAUDE_GATE_FILES"
          for file do
            [ -f "$file" ] || continue
            mise run exec -- pnpm --dir frontend exec eslint -- "$CLAUDE_PROJECT_DIR/$file"
          done
    run_checks:
      - frontend-build

  # Same Stylelint rules as frontend CI, scoped to changed stylesheets.
  - match: "frontend/src/**/*.scss"
    run:
      - name: frontend-styles-lint
        cmd: |
          set -eu
          eval "set -- $CLAUDE_GATE_FILES"
          for file do
            [ -f "$file" ] || continue
            mise run exec -- pnpm --dir frontend exec stylelint "$CLAUDE_PROJECT_DIR/$file"
          done
    run_checks:
      - frontend-build

  # Use the CI test script, limited to edited tests or sibling tests of edited sources.
  - match: "frontend/src/**/*.{ts,tsx}"
    run:
      - name: frontend-test
        cmd: |
          set -eu
          eval "set -- $CLAUDE_GATE_FILES"
          tests=$(mktemp)
          trap 'rm -f "$tests"' EXIT
          for file do
            case "$file" in
              *.test.ts|*.test.tsx)
                if [ -f "$file" ]; then
                  printf '%s\n' "$file" >> "$tests"
                fi
                ;;
              *)
                for test_file in "${file%.*}.test.ts" "${file%.*}.test.tsx"; do
                  [ -f "$test_file" ] || continue
                  printf '%s\n' "$test_file" >> "$tests"
                done
                ;;
            esac
          done
          sort -u "$tests" -o "$tests"
          set --
          while IFS= read -r test_file; do
            set -- "$@" "$CLAUDE_PROJECT_DIR/$test_file"
          done < "$tests"
          [ "$#" -gt 0 ] || exit 0
          mise run exec -- pnpm --dir frontend run test --passWithNoTests "$@"
        timeout: 60
    run_checks:
      - frontend-build

  # stdin avoids traversing unchanged Rust modules; diff fails on formatting changes.
  - match:
      - "backend/**/*.rs"
      - "backend/**/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/tauri.conf.json"
      - "backend/capabilities/*.json"
    timeout: 60
    run:
      - name: rust-format-check
        cmd: |
          set -eu
          eval "set -- $CLAUDE_GATE_FILES"
          formatted=$(mktemp)
          trap 'rm -f "$formatted"' EXIT
          for file do
            case "$file" in *.rs) ;; *) continue ;; esac
            [ -f "$file" ] || continue
            mise run exec -- rustfmt --edition 2024 --emit stdout < "$file" > "$formatted"
            diff -u "$file" "$formatted"
          done
    run_checks:
      - backend-build

  # Keep the existing architectural regression check.
  - match:
      - "frontend/**/*.{ts,tsx,js,jsx,mjs,cjs,json,yaml,yml}"
      - ".depgraph.yml"
      - ".depgraphignore"
      - "mise.toml"
    timeout: 60
    run:
      - name: depgraph
        cmd: mise run exec -- depgraph gate --root .

# Whole-project builds run once at the end for each affected side.
consistency_checks:
  - name: frontend-build
    run:
      - name: frontend-build
        cmd: mise run exec -- pnpm --dir frontend run build
        files: false
        timeout: 600

  - name: backend-build
    run:
      - name: backend-build
        cmd: mise run exec -- cargo build --workspace --locked --manifest-path backend/Cargo.toml
        files: false
        timeout: 600
