policy: false

rules:
  # CI runs pnpm run lint; check.sh scopes ESLint and runs the same styles:lint.
  - match:
      - "frontend/src/**/*.{ts,tsx,scss}"
      - "frontend/*.{json,yaml,ts,js}"
    run:
      - name: apps-lint
        cmd: bash ".agents/scripts/check.sh" lint
      - name: format
        cmd: bash ".agents/scripts/check.sh" format
    run_checks:
      - build

  # depgraph's quality gate compares new findings with the session baseline.
  - match:
      - "frontend/**/*.{ts,tsx,js,jsx,mjs,cjs,json,yaml,yml}"
      - ".depgraph.yml"
      - ".depgraphignore"
      - "mise.toml"
    timeout: 60
    run:
      - name: depgraph
        cmd: mise exec -- depgraph gate --root .

consistency_checks:
  # Same frontend build as CI, including SCSS type generation and TypeScript.
  - name: build
    run:
      - name: build
        cmd: bash ".agents/scripts/check.sh" build
        timeout: 600
