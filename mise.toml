[tools]
rust = "1.99.1"
node = "24.22.3"
pnpm = "11.28.11"
"github:nonchan7720/depgraph" = "0.1.8"

[env]
TAURI_APP_PATH = "{{ config_root }}/backend"
TAURI_FRONTEND_PATH = "{{ config_root }}/frontend"

[tasks.setup]
description = "Install frontend dependencies from pnpm-lock.yaml"
dir = "{{ config_root }}/frontend"
run = "pnpm install --frozen-lockfile"

[tasks.lock]
description = "Generate or update pnpm-lock.yaml"
dir = "{{ config_root }}/frontend"
run = "pnpm install --lockfile-only --no-frozen-lockfile"

[tasks.dev]
description = "Run the Tauri desktop app in development mode"
dir = "{{ config_root }}/frontend"
run = "pnpm run tauri dev"

[tasks.depgraph]
description = "Watch the repository dependency graph with depgraph"
dir = "{{ config_root }}"
run = "depgraph watch --root ."

[tasks.format]
description = "Format all frontend and backend code"
dir = "{{ config_root }}"
run = [
  "pnpm --dir frontend run format",
  "cargo fmt --all --manifest-path backend/Cargo.toml",
]

[tasks.exec]
description = "Run a command with the project toolchain"
dir = "{{ config_root }}"
quiet = true
raw = true
run = "exec"

[tasks.eslint]
description = "Run ESLint on the frontend"
dir = "{{ config_root }}/frontend"
run = "pnpm run lint"

[tasks.check]
description = "Check formatting, lint, tests, and builds across the project"
dir = "{{ config_root }}"
run = [
  "pnpm --dir frontend run format:check",
  "pnpm --dir frontend run lint",
  "pnpm --dir frontend run test",
  "pnpm --dir frontend run build",
  "cargo fmt --all --manifest-path backend/Cargo.toml -- --check",
  "cargo check --workspace --locked --manifest-path backend/Cargo.toml",
  "cargo test --workspace --locked --manifest-path backend/Cargo.toml",
]

[tasks.build]
description = "Build and bundle the Tauri desktop app"
dir = "{{ config_root }}/frontend"
run = "pnpm run tauri build"
