name: Check PR title

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: read

jobs:
  required_check_title:
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreLabels: |
            autorelease: pending
            autorelease: tagged
            autorelease: published
