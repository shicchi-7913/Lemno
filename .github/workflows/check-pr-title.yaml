name: Check PR title

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: read

jobs:
  required_check_title:
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 #v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreLabels: |
            autorelease: pending
            autorelease: tagged
            autorelease: published
