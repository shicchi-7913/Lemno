# yaml-language-server: $schema=https://raw.githubusercontent.com/nonchan7720/depgraph/v0.1.8/schema/depgraph.schema.json
project: lemno
components:
  frontend:
    layers:
      app: ["src/app/**"]
      pages: ["src/pages/**"]
      features: ["src/features/**"]
      shared: ["src/shared/**"]
    forbidden:
      pages: [app]
      features: [app, pages]
      shared: [app, pages, features]
rules:
  unreachable-file:
    entries:
      - frontend/src/app/main.tsx
      - frontend/vite.config.ts
